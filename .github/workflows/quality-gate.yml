name: Quality Gate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # (si ton script est en pur Node et n'a pas besoin d'installer des deps, tu peux sauter "npm ci")
      # - name: Install deps
      #   run: npm ci

      - name: Run quality gate
        run: node ci/gate.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
